name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install pedit dependencies
        run: bun install --cwd pedit

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/cli _site/pdf-viewer

          tar --exclude='node_modules' --exclude='.env*' -czf _site/cli/pedit.tar.gz pedit
          mv cli-page.html _site/cli/index.html
          PEDIT_PROBLEMS_DIR="$PWD/demo-problems" bun run viewer/export-static.ts _site/pdf-viewer

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>pedit CLI &amp; PDF Problem Viewer</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; max-width: 680px; margin: 4rem auto; padding: 0 1rem; line-height: 1.6; color: #111; }
              a { color: #0969da; text-decoration: none; font-weight: 600; font-size: 1.1rem; }
              a:hover { text-decoration: underline; }
              li { margin: 0.75rem 0; }
            </style>
          </head>
          <body>
            <h1>pedit CLI &amp; PDF Problem Viewer</h1>
            <ul>
              <li><a href="./cli/">pedit CLI</a></li>
              <li><a href="./pdf-viewer/">PDF Problem Viewer</a></li>
            </ul>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
