name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install pedit dependencies
        run: bun install --cwd pedit

      - name: Build unified static site
        run: |
          rm -rf _site
          PEDIT_PROBLEMS_DIR="$PWD/demo-problems" bun run pedit/src/export-static.ts _site
          tar --exclude='node_modules' --exclude='.env*' -czf _site/pedit.tar.gz pedit
          bun build pedit/src/index.ts --compile --target=bun-darwin-arm64 --outfile _site/pedit-macos-arm64
          bun build pedit/src/index.ts --compile --target=bun-linux-x64 --outfile _site/pedit-linux-x64

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
